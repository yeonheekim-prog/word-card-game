<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Nick의 단어 카드</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, #ffe9f0 0%, #e6f3ff 50%, #fdf6d8 100%);
    color:#3a3a4a;
    display:flex; flex-direction:column;
    min-height:100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    user-select:none; -webkit-user-select:none;
  }
  header {
    text-align:center; padding:16px 12px 8px;
  }
  header h1 { font-size:22px; }
  #starCount {
    display:inline-block; margin-top:4px; background:#fff; border-radius:20px;
    padding:4px 14px; font-size:15px; box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  main { flex:1; padding:8px 16px 90px; max-width:480px; width:100%; margin:0 auto; }
  .hidden { display:none !important; }

  /* 탭바 */
  nav {
    position:fixed; bottom:0; left:0; right:0;
    display:flex; background:#fff; box-shadow:0 -2px 10px rgba(0,0,0,.08);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex:1; border:none; background:none; padding:10px 4px 8px;
    font-size:12px; color:#999; min-height:56px; cursor:pointer;
  }
  nav button .ico { display:block; font-size:24px; margin-bottom:2px; }
  nav button.on { color:#ff5d8f; font-weight:700; }

  /* 공통 버튼 */
  .btn {
    display:block; width:100%; border:none; border-radius:16px;
    padding:14px; font-size:18px; font-weight:700; cursor:pointer;
    min-height:52px; color:#fff; margin-top:10px;
  }
  .btn:active { transform:scale(.97); }
  .btn-pink { background:#ff5d8f; }
  .btn-blue { background:#4d96ff; }
  .btn-green { background:#3ec96f; }
  .btn-gray { background:#c2c2cf; }

  /* ── 카드 외우기 ── */
  #cardBox {
    perspective:1000px; margin-top:10px;
  }
  #card {
    position:relative; width:100%; height:300px;
    transform-style:preserve-3d; transition:transform .45s;
    cursor:pointer;
  }
  #card.flip { transform:rotateY(180deg); }
  .face {
    position:absolute; inset:0; border-radius:24px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.12); padding:20px; text-align:center;
  }
  .face .label { font-size:14px; color:#fff; opacity:.85; margin-bottom:10px; }
  .face .txt { font-size:34px; font-weight:800; color:#fff; word-break:keep-all; }
  .face.front { background:linear-gradient(145deg,#ff8fb3,#ff5d8f); }
  .face.back { background:linear-gradient(145deg,#6db4ff,#4d96ff); transform:rotateY(180deg); }
  .face .hint { margin-top:14px; font-size:13px; color:#fff; opacity:.8; }
  .speakBtn {
    margin-top:14px; border:none; background:rgba(255,255,255,.3); color:#fff;
    border-radius:22px; padding:10px 18px; font-size:16px; font-weight:700;
    min-height:44px; cursor:pointer;
  }
  .speakBtn:active { transform:scale(.95); }
  .speakBtn.blue { display:block; background:#4d96ff; margin:0 auto 14px; }
  #judgeRow { display:flex; gap:10px; }
  #judgeRow .btn { flex:1; }
  #progressTxt { text-align:center; margin-top:10px; font-size:14px; color:#777; }
  .bigMsg { text-align:center; padding:50px 10px; font-size:18px; color:#666; line-height:1.7; }
  .bigMsg .emoji { font-size:56px; display:block; margin-bottom:12px; }

  /* ── 퀴즈 ── */
  #quizWord {
    background:#fff; border-radius:20px; text-align:center;
    padding:34px 16px; font-size:32px; font-weight:800;
    box-shadow:0 6px 16px rgba(0,0,0,.1); margin:10px 0 16px;
  }
  .choice {
    display:block; width:100%; background:#fff; border:3px solid #e3e3ee;
    border-radius:14px; padding:14px; font-size:17px; font-weight:600;
    margin-bottom:10px; min-height:52px; cursor:pointer; color:#3a3a4a;
    text-align:center; word-break:keep-all;
  }
  .choice.ok { border-color:#3ec96f; background:#e5f9ec; }
  .choice.no { border-color:#ff6b6b; background:#ffecec; }
  #quizScore { text-align:center; font-size:15px; color:#777; margin-top:4px; }

  /* ── 단어장 ── */
  .inputRow { background:#fff; border-radius:18px; padding:16px; box-shadow:0 4px 12px rgba(0,0,0,.08); }
  .inputRow input {
    width:100%; border:2px solid #e3e3ee; border-radius:12px;
    padding:12px; font-size:17px; margin-bottom:10px; outline:none;
  }
  .inputRow input:focus { border-color:#ff5d8f; }
  #wordList { margin-top:16px; }
  .wordItem {
    background:#fff; border-radius:14px; padding:12px 14px; margin-bottom:8px;
    display:flex; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,.06);
  }
  .wordItem .info { flex:1; min-width:0; }
  .wordItem .w { font-size:17px; font-weight:700; }
  .wordItem .m { font-size:14px; color:#888; margin-top:2px; }
  .wordItem .lv { font-size:13px; margin-left:8px; white-space:nowrap; }
  .wordItem .del {
    border:none; background:#ffecec; color:#ff6b6b; border-radius:10px;
    min-width:44px; min-height:44px; font-size:16px; margin-left:8px; cursor:pointer;
  }
  #listCount { font-size:14px; color:#888; margin:14px 2px 6px; }

  /* 축하 효과 */
  .confetti {
    position:fixed; top:-20px; font-size:24px; z-index:99; pointer-events:none;
    animation:fall 1.6s ease-in forwards;
  }
  @keyframes fall {
    to { transform:translateY(105vh) rotate(360deg); opacity:.6; }
  }
  #toast {
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%);
    background:#3a3a4a; color:#fff; padding:10px 20px; border-radius:20px;
    font-size:15px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:100;
    white-space:nowrap;
  }
  #toast.show { opacity:1; }

  /* 보상 축하 화면 */
  #rewardOverlay {
    position:fixed; inset:0; z-index:200;
    background:rgba(30,20,50,.55);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  #rewardCard {
    background:linear-gradient(160deg,#fff6d9,#ffe3ee);
    border-radius:28px; padding:34px 24px; text-align:center;
    width:100%; max-width:340px; box-shadow:0 12px 40px rgba(0,0,0,.3);
    animation:pop .45s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop { from { transform:scale(.5); opacity:0; } to { transform:scale(1); opacity:1; } }
  #rewardCard .trophy { font-size:72px; animation:bounce 1s infinite alternate; display:inline-block; }
  @keyframes bounce { from { transform:translateY(0); } to { transform:translateY(-12px); } }
  #rewardCard h2 { font-size:22px; margin:10px 0 6px; color:#3a3a4a; }
  #rewardCard p { font-size:16px; color:#777; line-height:1.6; }
  #rewardCard .shelf { font-size:26px; margin-top:10px; letter-spacing:4px; word-break:break-all; }

  /* 주간 정리 화면 */
  #reportOverlay {
    position:fixed; inset:0; z-index:200;
    background:rgba(30,20,50,.55);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  #reportCard {
    background:#fff; border-radius:28px; padding:26px 22px;
    width:100%; max-width:360px; max-height:80vh;
    display:flex; flex-direction:column;
    box-shadow:0 12px 40px rgba(0,0,0,.3);
    animation:pop .45s cubic-bezier(.2,1.6,.4,1);
  }
  #reportCard h2 { text-align:center; font-size:20px; color:#3a3a4a; }
  #reportSub { text-align:center; color:#777; font-size:14px; margin:6px 0 12px; }
  #reportList { overflow-y:auto; flex:1; -webkit-overflow-scrolling:touch; }
  .reportItem {
    padding:10px 8px; border-bottom:1px dashed #eee; font-size:15px;
    word-break:keep-all;
  }
  .reportItem .rw { font-weight:700; }
  .reportItem .rm { color:#888; font-size:14px; margin-top:2px; }

  /* 오늘의 단어 */
  #todayInfo {
    background:#fff; border-radius:16px; padding:10px 14px; text-align:center;
    font-size:15px; box-shadow:0 2px 8px rgba(0,0,0,.06);
  }
  #todayDots { font-size:20px; letter-spacing:4px; margin-top:4px; }

  /* 몬스터 */
  #monPanel {
    background:linear-gradient(160deg,#fff,#f3ecff); border-radius:24px;
    padding:18px 16px; text-align:center; box-shadow:0 6px 16px rgba(0,0,0,.1);
  }
  #monEmoji { font-size:80px; display:inline-block; line-height:1.1; }
  #monEmoji.egg { animation:wobble 1.2s infinite ease-in-out; }
  @keyframes wobble { 0%,100% { transform:rotate(0); } 25% { transform:rotate(-10deg); } 75% { transform:rotate(10deg); } }
  #monName { font-size:20px; font-weight:800; margin-top:6px; }
  #monStage { font-size:13px; color:#888; margin-top:2px; }
  .expBar { height:16px; background:#eee; border-radius:10px; overflow:hidden; margin:12px 0 6px; }
  #expFill { height:100%; width:0; background:linear-gradient(90deg,#ffcf3f,#ff5d8f); transition:width .5s; }
  #expTxt { font-size:14px; color:#666; }
  #dex { margin-top:14px; font-size:14px; color:#777; }
  #dexList { font-size:30px; letter-spacing:4px; margin-top:4px; word-break:break-all; }
  #miniMon { text-align:center; font-size:14px; color:#777; margin-top:10px; }
  #miniMon b { font-size:22px; }
</style>
</head>
<body>

<header>
  <h1>🃏 Nick의 단어 카드</h1>
  <div id="starCount">⭐ 0개 모았어요</div>
</header>

<main>
  <!-- 카드 외우기 -->
  <section id="tab-study">
    <div id="studyEmpty" class="bigMsg hidden">
      <span class="emoji">📝</span>
      아직 단어가 없어요!<br>아래 <b>단어 넣기</b>에서<br>새로 알게 된 단어를 넣어 주세요.
    </div>
    <div id="studyDone" class="hidden">
      <div class="bigMsg" style="padding:30px 10px 10px">
        <span class="emoji">🎉</span>
        <span id="studyDoneTxt">오늘의 단어 5개 끝!<br>정말 잘했어요!</span>
      </div>
      <button class="btn btn-blue" id="goQuizBtn">🎮 퀴즈 풀고 몬스터 키우기</button>
      <button class="btn btn-pink" id="restudyBtn">🔄 오늘 단어 다시 보기</button>
      <button class="btn btn-green" id="reviewAllBtn">📚 모은 단어 전체 복습</button>
    </div>
    <div id="todayInfo" class="hidden">
      <b id="todayTitle">📅 오늘의 단어</b>
      <div id="todayDots"></div>
    </div>
    <div id="studyArea">
      <div id="cardBox">
        <div id="card">
          <div class="face front">
            <div class="label">이 단어 뜻이 뭘까요?</div>
            <div class="txt" id="cardFront"></div>
            <button id="speakBtn" class="speakBtn hidden">🔊 발음 듣기</button>
            <div class="hint">👆 카드를 눌러서 뒤집어 보세요</div>
          </div>
          <div class="face back">
            <div class="label">뜻은 바로~</div>
            <div class="txt" id="cardBack"></div>
          </div>
        </div>
      </div>
      <div id="judgeRow" class="hidden">
        <button class="btn btn-green" id="knowBtn">😊 외웠어요</button>
        <button class="btn btn-gray" id="dontBtn">🤔 아직이에요</button>
      </div>
      <div id="progressTxt"></div>
    </div>
  </section>

  <!-- 퀴즈 -->
  <section id="tab-quiz" class="hidden">
    <div id="monPanel">
      <span id="monEmoji">🥚</span>
      <div id="monName"></div>
      <div id="monStage"></div>
      <div class="expBar"><div id="expFill"></div></div>
      <div id="expTxt"></div>
      <div id="dex"><div>📖 내 몬스터 도감</div><div id="dexList"></div></div>
    </div>
    <div id="quizEmpty" class="bigMsg hidden">
      <span class="emoji">🃏</span>
      먼저 <b>오늘의 단어</b>를 외워 주세요!<br>외운 단어가 <b>5개</b> 넘으면<br>퀴즈를 할 수 있어요.
    </div>
    <div id="quizArea" class="hidden">
      <div id="quizWord"></div>
      <button id="quizSpeakBtn" class="speakBtn blue hidden">🔊 발음 듣기</button>
      <div id="choices"></div>
      <div id="quizScore"></div>
      <div id="miniMon"></div>
    </div>
    <div id="quizStart">
      <div class="bigMsg" style="padding:24px 10px 6px">지금까지 외운 단어 중에서 랜덤 10문제!<br>맞힐 때마다 몬스터가 쑥쑥 자라요.</div>
      <button class="btn btn-blue" id="quizGoBtn">🚀 퀴즈 시작!</button>
    </div>
    <div id="quizEnd" class="hidden">
      <div class="bigMsg">
        <span class="emoji" id="quizEndEmoji">🏆</span>
        <span id="quizEndTxt"></span>
      </div>
      <button class="btn btn-blue" id="quizAgainBtn">🔄 다시 도전!</button>
    </div>
  </section>

  <!-- 단어장 -->
  <section id="tab-words" class="hidden">
    <div class="inputRow">
      <input id="inWord" type="text" placeholder="새로 알게 된 단어" maxlength="30">
      <input id="inMean" type="text" placeholder="단어의 뜻 (쉽게 써 주세요)" maxlength="60">
      <button class="btn btn-pink" id="addBtn">➕ 단어 넣기</button>
    </div>
    <button class="btn btn-blue" id="weeklyBtn">📚 이번 주 배운 단어 보기</button>
    <div id="listCount"></div>
    <div id="wordList"></div>
  </section>
</main>

<nav>
  <button data-tab="study" class="on"><span class="ico">🃏</span>오늘의 단어</button>
  <button data-tab="quiz"><span class="ico">🐉</span>퀴즈·진화</button>
  <button data-tab="words"><span class="ico">📝</span>단어장</button>
</nav>

<div id="toast"></div>

<div id="rewardOverlay" class="hidden">
  <div id="rewardCard">
    <span class="trophy" id="rewardIcon">🏆</span>
    <h2 id="rewardTitle"></h2>
    <p id="rewardMsg"></p>
    <div class="shelf" id="rewardShelf"></div>
    <button class="btn btn-pink" id="rewardCloseBtn">🎈 신난다! 계속하기</button>
  </div>
</div>

<div id="reportOverlay" class="hidden">
  <div id="reportCard">
    <h2>📚 이번 주 배운 단어</h2>
    <p id="reportSub"></p>
    <div id="reportList"></div>
    <button class="btn btn-blue" id="reportCloseBtn">✅ 다 봤어요</button>
  </div>
</div>

<script>
(function(){
  var KEY = 'wordCardGame_v1';
  var state = { words: [], stars: 0 };
  // words: [{w:단어, m:뜻, lv:0~3}]  lv3 = 다 외움

  function load(){
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.words)) state = d;
        if (typeof state.stars !== 'number') state.stars = 0;
      }
      // 이미 모은 별은 소급 축하하지 않기 (기존 사용자 처리)
      if (typeof state.celebrated !== 'number') state.celebrated = Math.floor(state.stars / 20);
      // 예전에 넣은 단어에는 넣은 날짜가 없으니 오늘로 채우기
      state.words.forEach(function(x){ if (typeof x.t !== 'number') x.t = Date.now(); });
    } catch(e) {}
    if (!state.att) state.att = { last: '', streak: 0, total: 0 };
    if (!state.mon) state.mon = { line: 0, exp: 0, dex: [] };
    if (!Array.isArray(state.mon.dex)) state.mon.dex = [];
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
    renderStars();
  }
  function $(id){ return document.getElementById(id); }

  /* 트로피 수에 따른 등급 */
  var RANKS = [
    [0, '🌱', '새싹'], [1, '🌿', '풀잎'], [2, '🪴', '화분'], [3, '🌳', '나무'],
    [5, '🌲', '큰 나무'], [7, '🌻', '꽃밭'], [10, '🏕️', '작은 숲'],
    [15, '🏞️', '큰 숲'], [20, '🌈', '마법의 숲'], [30, '👑', '단어왕']
  ];
  function rankOf(trophies){
    var r = RANKS[0];
    for (var i = 0; i < RANKS.length; i++) {
      if (trophies >= RANKS[i][0]) r = RANKS[i];
    }
    return r;
  }

  function renderStars(){
    var r = rankOf(state.celebrated || 0);
    var streak = (state.att && state.att.streak) ? ' · 🔥' + state.att.streak + '일 연속' : '';
    $('starCount').textContent = '⭐ ' + state.stars + '개 · ' + r[1] + ' ' + r[2] + streak;
  }

  /* ── 날짜 (그 기기의 오늘 날짜) ── */
  function dayKey(dt){
    dt = dt || new Date();
    return dt.getFullYear() + '-' + (dt.getMonth()+1) + '-' + dt.getDate();
  }
  function yesterdayKey(){
    var n = new Date();
    return dayKey(new Date(n.getFullYear(), n.getMonth(), n.getDate() - 1));
  }

  /* ── 기본 영어 단어장 (매일 5개씩 꺼내 줌) ── */
  // 호주 Year 3 수준 (학교 생활·철자 단어·호주 동물/자연·수학·과학·감정 등 10개씩 묶음)
  var BANK_RAW = [
    "recess|오전 쉬는 시간","tuckshop|학교 매점","uniform|교복","assembly|전교 모임, 조회","excursion|현장 학습","homework|숙제","timetable|시간표","library|도서관","spelling|철자, 받아쓰기","reading|읽기",
    "because|왜냐하면","friend|친구","people|사람들","different|다른","favourite|가장 좋아하는","together|함께","enough|충분한","through|~을 통과해서","thought|생각했다","believe|믿다",
    "mate|친구 (호주 말)","arvo|오후 (호주 말)","brekkie|아침밥 (호주 말)","footpath|인도, 보도","rubbish|쓰레기","jumper|스웨터","thongs|조리 슬리퍼 (호주 말)","swimmers|수영복 (호주 말)","sunscreen|선크림","esky|아이스박스 (호주 말)",
    "beautiful|아름다운","important|중요한","interesting|재미있는, 흥미로운","special|특별한","suddenly|갑자기","early|일찍, 이른","minute|(시간) 분","nothing|아무것도 없음","whole|전체의, 통째로","already|이미, 벌써",
    "kangaroo|캥거루","koala|코알라","wombat|웜뱃","platypus|오리너구리","echidna|가시두더지","kookaburra|쿠카부라 (웃는 새)","possum|주머니여우","magpie|까치","cockatoo|앵무새 (코카투)","crocodile|악어",
    "addition|덧셈","subtraction|뺄셈","multiply|곱하다","divide|나누다 (나눗셈)","fraction|분수","half|절반","quarter|4분의 1","double|두 배","estimate|어림하다","measure|재다, 측정하다",
    "curious|호기심 많은","honest|정직한","polite|예의 바른","patient|참을성 있는","nervous|긴장한, 떨리는","embarrassed|창피한","confused|헷갈리는","grateful|고마워하는","generous|너그러운, 잘 나눠 주는","responsible|책임감 있는",

  ];
  var EVO = [0, 5, 20, 45];   // 맞힌 개수가 이만큼 되면 다음 모습으로
  var STAGE_NAME = ['알', '아기', '청소년', '최종 진화'];

  function stageOf(exp){
    var s = 0;
    for (var i = 0; i < EVO.length; i++) if (exp >= EVO[i]) s = i;
    return s;
  }
  function monNow(){
    var line = LINES[state.mon.line % LINES.length];
    var st = stageOf(state.mon.exp);
    return { line: line, st: st, e: line[st][0], n: line[st][1] };
  }

  function renderMon(){
    var m = monNow();
    var el = $('monEmoji');
    el.textContent = m.e;
    el.classList.toggle('egg', m.st === 0);
    $('monName').textContent = m.n;
    $('monStage').textContent = STAGE_NAME[m.st] + ' 단계 (' + (m.st + 1) + '/4)';
    var lo = EVO[m.st], hi = EVO[m.st + 1];
    var pct = Math.round((state.mon.exp - lo) / (hi - lo) * 100);
    $('expFill').style.width = pct + '%';
    var left = hi - state.mon.exp;
    $('expTxt').textContent = m.st === 0
      ? '퀴즈를 ' + left + '개 더 맞히면 알이 깨어나요!'
      : '퀴즈를 ' + left + '개 더 맞히면 진화해요!';
    var dex = state.mon.dex;
    $('dexList').textContent = dex.length
      ? dex.map(function(i){ var L = LINES[i % LINES.length]; return L[3][0]; }).join('')
      : '아직 비어 있어요';
    $('miniMon').innerHTML = '<b>' + m.e + '</b> ' + m.n + ' · 진화까지 ' + left + '개';
  }

  function feedMon(){
    var before = stageOf(state.mon.exp);
    state.mon.exp++;
    var after = stageOf(state.mon.exp);
    var line = LINES[state.mon.line % LINES.length];
    if (after === 3 && before < 3) {
      // 최종 진화 → 도감에 넣고 새 알 받기
      state.mon.dex.push(state.mon.line);
      var nextLine = LINES[(state.mon.line + 1) % LINES.length];
      showReward(line[3][0], '최종 진화!! ' + line[3][1],
        line[2][0] + ' ➜ ' + line[3][0] + '<br>도감에 등록했어요! 📖<br>새 알이 도착했어요: ' + nextLine[0][0] + ' ' + nextLine[0][1],
        state.mon.dex.map(function(i){ return LINES[i % LINES.length][3][0]; }).join(''));
      state.mon.line++;
      state.mon.exp = 0;
    } else if (after > before) {
      var msg = before === 0
        ? '알이 깨어났어요!<br>' + line[0][0] + ' ➜ ' + line[after][0]
        : '몬스터가 진화했어요!<br>' + line[before][0] + ' ' + line[before][1] + ' ➜ ' + line[after][0] + ' ' + line[after][1];
      showReward(line[after][0], (before === 0 ? '짜잔! ' : '진화! ') + line[after][1], msg, '');
    }
    save();
    renderMon();
  }

  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function(){ t.classList.remove('show'); }, 1500);
  }

  function confetti(){
    var emojis = ['🎉','⭐','💖','✨','🌟'];
    for (var i=0; i<14; i++){
      var s = document.createElement('span');
      s.className = 'confetti';
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      s.style.left = (Math.random()*95) + 'vw';
      s.style.animationDelay = (Math.random()*0.4) + 's';
      document.body.appendChild(s);
      (function(el){ setTimeout(function(){ el.remove(); }, 2200); })(s);
    }
  }

  /* ── 별 20개마다 보상 축하 ── */
  function checkReward(){
    var block = Math.floor(state.stars / 20);
    if (block > state.celebrated) {
      var before = rankOf(state.celebrated);
      state.celebrated = block;
      var after = rankOf(block);
      save();
      var msg = '와~ Nick 정말 대단해요!<br>새 트로피를 받았어요!';
      if (after !== before) {
        msg += '<br>등급이 올랐어요: <b>' + after[1] + ' ' + after[2] + '</b>!';
      }
      var shelf = '';
      for (var i = 0; i < Math.min(block, 20); i++) shelf += '🏆';
      showReward('🏆', '⭐ 별 ' + (block * 20) + '개 달성!', msg, shelf);
    }
  }

  /* 축하 화면은 순서대로 하나씩 보여 주기 */
  var rewardQueue = [];
  function showReward(icon, title, msgHtml, shelf){
    rewardQueue.push([icon, title, msgHtml, shelf || '']);
    if ($('rewardOverlay').classList.contains('hidden')) nextReward();
  }
  function nextReward(){
    var r = rewardQueue.shift();
    if (!r) { $('rewardOverlay').classList.add('hidden'); return; }
    $('rewardIcon').textContent = r[0];
    $('rewardTitle').textContent = r[1];
    $('rewardMsg').innerHTML = r[2];
    $('rewardShelf').textContent = r[3];
    $('rewardOverlay').classList.remove('hidden');
    confetti();
    setTimeout(confetti, 500);
    setTimeout(confetti, 1000);
  }
  $('rewardCloseBtn').addEventListener('click', nextReward);

  /* ── 매일 출석 ── */
  function checkAttendance(){
    var today = dayKey();
    if (state.att.last === today) return;
    state.att.streak = (state.att.last === yesterdayKey()) ? state.att.streak + 1 : 1;
    state.att.total++;
    state.att.last = today;
    var bonus = state.att.streak >= 7 ? 3 : (state.att.streak >= 3 ? 2 : 1);
    state.stars += bonus;
    save();
    showReward('📅', '출석 ' + state.att.total + '일째!',
      '🔥 ' + state.att.streak + '일 연속 왔어요! 출석 별 ⭐+' + bonus + '<br>오늘의 단어 <b>5개</b>가 도착했어요!', '');
    checkReward();
  }

  /* ── 주간 배운 단어 정리 ── */
  var WEEK = 7 * 24 * 60 * 60 * 1000;

  function showReport(sinceTs){
    var list = state.words.filter(function(x){ return (x.t || 0) >= sinceTs; });
    if (!list.length) return false;
    var done = list.filter(function(x){ return x.lv >= 3; }).length;
    $('reportSub').textContent = '새 단어 ' + list.length + '개 · 완전히 외운 단어 ' + done + '개';
    var box = $('reportList');
    box.innerHTML = '';
    list.forEach(function(x){
      var d = document.createElement('div');
      d.className = 'reportItem';
      d.innerHTML = '<div class="rw"></div><div class="rm"></div>';
      d.querySelector('.rw').textContent = (x.lv >= 3 ? '🏅 ' : '⭐ ') + x.w;
      d.querySelector('.rm').textContent = x.m;
      box.appendChild(d);
    });
    $('reportOverlay').classList.remove('hidden');
    return true;
  }

  $('reportCloseBtn').addEventListener('click', function(){
    $('reportOverlay').classList.add('hidden');
  });

  $('weeklyBtn').addEventListener('click', function(){
    if (!showReport(Date.now() - WEEK)) toast('이번 주에 넣은 단어가 아직 없어요');
  });

  function weeklyCheck(){
    if (typeof state.lastReport !== 'number') {
      state.lastReport = Date.now();
      save();
      return;
    }
    if (Date.now() - state.lastReport >= WEEK) {
      showReport(state.lastReport);
      state.lastReport = Date.now();
      save();
    }
  }

  /* ── 탭 ── */
  var tabs = document.querySelectorAll('nav button');
  tabs.forEach(function(b){
    b.addEventListener('click', function(){
      tabs.forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      ['study','quiz','words'].forEach(function(name){
        $('tab-'+name).classList.toggle('hidden', name !== b.dataset.tab);
      });
      if (b.dataset.tab === 'study') startStudy();
      if (b.dataset.tab === 'quiz') resetQuizScreen();
      if (b.dataset.tab === 'words') renderList();
    });
  });

  /* ── 단어장 ── */
  function renderList(){
    var list = $('wordList');
    list.innerHTML = '';
    $('listCount').textContent = state.words.length
      ? '모은 단어 ' + state.words.length + '개'
      : '';
    state.words.slice().reverse().forEach(function(item){
      var idx = state.words.indexOf(item);
      var div = document.createElement('div');
      div.className = 'wordItem';
      var lvStars = item.lv >= 3 ? '🏅' : '⭐'.repeat(item.lv) + '☆'.repeat(3-item.lv);
      div.innerHTML =
        '<div class="info"><div class="w"></div><div class="m"></div></div>' +
        '<span class="lv">' + lvStars + '</span>' +
        '<button class="del">🗑</button>';
      div.querySelector('.w').textContent = item.w;
      div.querySelector('.m').textContent = item.m;
      div.querySelector('.del').addEventListener('click', function(){
        if (confirm('"' + item.w + '" 단어를 지울까요?')) {
          state.words.splice(idx, 1);
          save(); renderList();
        }
      });
      list.appendChild(div);
    });
  }

  $('addBtn').addEventListener('click', function(){
    var w = $('inWord').value.trim();
    var m = $('inMean').value.trim();
    if (!w) { toast('단어를 써 주세요!'); return; }
    if (!m) { toast('뜻도 써 주세요!'); return; }
    var dup = state.words.some(function(x){ return x.w === w; });
    if (dup) { toast('이미 있는 단어예요!'); return; }
    state.words.push({ w:w, m:m, lv:0, t:Date.now() });
    save();
    $('inWord').value = ''; $('inMean').value = '';
    $('inWord').focus();
    toast('단어를 넣었어요! 🎈');
    renderList();
  });

  /* ── 발음 듣기 (영어 단어) ── */
  function isEnglish(t){ return /[A-Za-z]/.test(t); }
  function speak(text){
    if (!('speechSynthesis' in window)) { toast('이 기기는 발음을 지원하지 않아요'); return; }
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.85;
      speechSynthesis.speak(u);
    } catch(e) {}
  }

  /* ── 카드 외우기 ── */
  var queue = [], cur = null, total = 0;
  var mode = 'today';   // today = 오늘의 단어 5개, review = 전체 복습
  var DAILY_N = 5;

  function findWord(w){
    for (var i = 0; i < state.words.length; i++) if (state.words[i].w === w) return state.words[i];
    return null;
  }

  // 오늘의 단어 5개 정하기: ①못 끝낸 단어 ②직접 넣은 새 단어 ③기본 단어장 순서
  function ensureDaily(){
    var today = dayKey();
    if (state.daily && state.daily.date === today) return;
    var pick = [];
    var notYet = state.words.filter(function(x){ return x.lv === 0; })
      .sort(function(a,b){ return (b.d ? 1 : 0) - (a.d ? 1 : 0) || a.t - b.t; });
    notYet.forEach(function(x){ if (pick.length < DAILY_N) pick.push(x.w); });
    var have = {};
    state.words.forEach(function(x){ have[x.w.toLowerCase()] = true; });
    for (var i = 0; i < BANK.length && pick.length < DAILY_N; i++) {
      var b = BANK[i];
      if (have[b.w.toLowerCase()]) continue;
      state.words.push({ w:b.w, m:b.m, lv:0, t:Date.now(), src:'bank' });
      have[b.w.toLowerCase()] = true;
      pick.push(b.w);
    }
    // 단어장을 다 외웠으면 덜 외운 단어로 복습
    if (pick.length < DAILY_N) {
      shuffle(state.words.slice()).sort(function(a,b){ return a.lv - b.lv; }).forEach(function(x){
        if (pick.length < DAILY_N && pick.indexOf(x.w) < 0) pick.push(x.w);
      });
    }
    pick.forEach(function(w){ var x = findWord(w); if (x && !x.d) x.d = today; });
    state.daily = { date: today, words: pick, ok: [], done: false };
    save();
  }

  function renderTodayDots(){
    var d = state.daily;
    var list = d.words.filter(findWord);
    $('todayTitle').textContent = mode === 'today'
      ? '📅 오늘의 단어 (' + d.ok.length + '/' + list.length + ')'
      : '📚 모은 단어 전체 복습';
    $('todayDots').textContent = mode === 'today'
      ? list.map(function(w){ return d.ok.indexOf(w) >= 0 ? '✅' : '⬜'; }).join('')
      : '';
  }

  function startStudy(){
    mode = 'today';
    ensureDaily();
    $('studyEmpty').classList.add('hidden');
    var d = state.daily;
    var list = d.words.map(findWord).filter(Boolean);
    if (d.done) { showStudyDone(); return; }
    $('studyDone').classList.add('hidden');
    $('todayInfo').classList.remove('hidden');
    $('studyArea').classList.remove('hidden');
    queue = shuffle(list.filter(function(x){ return d.ok.indexOf(x.w) < 0; }));
    total = queue.length;
    renderTodayDots();
    nextCard();
  }

  function startReview(onlyToday){
    mode = 'review';
    $('studyDone').classList.add('hidden');
    $('todayInfo').classList.remove('hidden');
    $('studyArea').classList.remove('hidden');
    if (onlyToday) {
      queue = shuffle(state.daily.words.map(findWord).filter(Boolean));
    } else {
      queue = state.words.filter(function(x){ return x.lv >= 1; }).sort(function(a,b){
        return (a.lv - b.lv) || (Math.random() - .5);
      });
    }
    if (!queue.length) { toast('아직 외운 단어가 없어요'); startStudy(); return; }
    total = queue.length;
    renderTodayDots();
    $('todayTitle').textContent = onlyToday ? '🔄 오늘 단어 다시 보기' : '📚 모은 단어 전체 복습';
    nextCard();
  }

  function showStudyDone(){
    $('studyArea').classList.add('hidden');
    $('todayInfo').classList.add('hidden');
    $('studyDone').classList.remove('hidden');
    $('studyDoneTxt').innerHTML = mode === 'today'
      ? '오늘의 단어 ' + state.daily.words.length + '개 끝!<br>내일 또 새 단어 5개가 와요.'
      : '복습 끝! 정말 잘했어요!';
  }

  function nextCard(){
    if (!queue.length) {
      if (mode === 'today' && !state.daily.done) {
        state.daily.done = true;
        state.stars += 5;
        save();
        showReward('🎁', '오늘의 단어 완료!', '5개 다 외웠어요! 보너스 별 ⭐+5<br>이제 퀴즈로 몬스터를 키워 봐요!', '');
        checkReward();
      } else {
        confetti();
      }
      showStudyDone();
      return;
    }
    cur = queue.shift();
    $('card').classList.remove('flip');
    $('cardFront').textContent = cur.w;
    $('cardBack').textContent = cur.m;
    $('judgeRow').classList.add('hidden');
    $('speakBtn').classList.toggle('hidden', !isEnglish(cur.w));
    $('progressTxt').textContent = '남은 카드 ' + (queue.length + 1) + ' / ' + total + '장';
  }

  $('speakBtn').addEventListener('click', function(e){
    e.stopPropagation();
    if (cur) speak(cur.w);
  });

  $('card').addEventListener('click', function(){
    var c = $('card');
    c.classList.toggle('flip');
    if (c.classList.contains('flip')) {
      $('judgeRow').classList.remove('hidden');
    }
  });

  $('knowBtn').addEventListener('click', function(){
    if (!cur) return;
    if (cur.lv < 3) {
      cur.lv++;
      if (cur.lv === 3) { toast('🏅 "' + cur.w + '" 완전히 외웠어요!'); confetti(); }
    }
    state.stars++;
    if (mode === 'today' && state.daily.ok.indexOf(cur.w) < 0) state.daily.ok.push(cur.w);
    save();
    checkReward();
    renderTodayDots();
    nextCard();
  });

  $('dontBtn').addEventListener('click', function(){
    if (!cur) return;
    if (mode === 'review') cur.lv = Math.max(1, cur.lv - 1);   // 복습 땐 퀴즈 목록에서 빠지지 않게
    else cur.lv = 0;
    save();
    // 조금 뒤에 다시 나오게 뒤쪽에 끼워넣기
    var pos = Math.min(2, queue.length);
    queue.splice(pos, 0, cur);
    total = Math.max(total, queue.length);
    nextCard();
  });

  $('restudyBtn').addEventListener('click', function(){ startReview(true); });
  $('reviewAllBtn').addEventListener('click', function(){ startReview(false); });
  $('goQuizBtn').addEventListener('click', function(){
    document.querySelector('nav button[data-tab="quiz"]').click();
  });

  /* ── 퀴즈 ── */
  var qList = [], qIdx = 0, qScore = 0;
  var QUIZ_LEN = 10;

  function learnedWords(){
    return state.words.filter(function(x){ return x.lv >= 1; });
  }

  function resetQuizScreen(){
    renderMon();
    $('monPanel').classList.remove('hidden');
    var enough = learnedWords().length >= 5;
    $('quizEmpty').classList.toggle('hidden', enough);
    $('quizStart').classList.toggle('hidden', !enough);
    $('quizArea').classList.add('hidden');
    $('quizEnd').classList.add('hidden');
  }

  function shuffle(arr){
    for (var i=arr.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function startQuiz(){
    qList = [];
    var pool = shuffle(learnedWords());
    while (qList.length < QUIZ_LEN) {
      qList = qList.concat(shuffle(pool.slice()));
    }
    qList = qList.slice(0, QUIZ_LEN);
    qIdx = 0; qScore = 0;
    $('monPanel').classList.add('hidden');
    $('quizStart').classList.add('hidden');
    $('quizEnd').classList.add('hidden');
    $('quizArea').classList.remove('hidden');
    showQuestion();
  }

  function showQuestion(){
    if (qIdx >= qList.length) { endQuiz(); return; }
    var q = qList[qIdx];
    $('quizWord').textContent = q.w;
    $('quizSpeakBtn').classList.toggle('hidden', !isEnglish(q.w));
    $('quizSpeakBtn').onclick = function(){ speak(q.w); };
    $('quizScore').textContent = (qIdx+1) + ' / ' + qList.length + '문제 · 맞힌 개수 ' + qScore;
    // 틀린 보기: 내 단어 + 기본 단어장에서 뜻이 겹치지 않게 3개
    var seen = {}; seen[q.m] = true;
    var wrongs = [];
    shuffle(state.words.concat(BANK).slice()).forEach(function(x){
      if (wrongs.length < 3 && !seen[x.m]) { seen[x.m] = true; wrongs.push(x); }
    });
    var options = shuffle(wrongs.concat([q]));
    var box = $('choices');
    box.innerHTML = '';
    var answered = false;
    options.forEach(function(opt){
      var b = document.createElement('button');
      b.className = 'choice';
      b.textContent = opt.m;
      b.addEventListener('click', function(){
        if (answered) return;
        answered = true;
        if (opt.m === q.m) {
          b.classList.add('ok');
          qScore++;
          state.stars++;
          save();
          checkReward();
          feedMon();
          confetti();
        } else {
          b.classList.add('no');
          Array.prototype.forEach.call(box.children, function(c){
            if (c.textContent === q.m) c.classList.add('ok');
          });
        }
        // 진화 축하 화면이 떠 있으면 닫을 때까지 다음 문제 기다리기
        var go = function(){
          if (!$('rewardOverlay').classList.contains('hidden')) { setTimeout(go, 300); return; }
          qIdx++; showQuestion();
        };
        setTimeout(go, 900);
      });
      box.appendChild(b);
    });
  }

  function endQuiz(){
    $('quizArea').classList.add('hidden');
    $('quizEnd').classList.remove('hidden');
    $('monPanel').classList.remove('hidden');
    renderMon();
    var msg, emo;
    if (qScore === qList.length) { emo = '🏆'; msg = '전부 맞혔어요!! 최고예요!'; confetti(); }
    else if (qScore >= qList.length * 0.7) { emo = '🌟'; msg = '정말 잘했어요!'; }
    else { emo = '💪'; msg = '괜찮아요! 카드로 더 연습해 봐요!'; }
    $('quizEndEmoji').textContent = emo;
    $('quizEndTxt').innerHTML = qList.length + '문제 중 <b>' + qScore + '개</b> 맞혔어요!<br>' + msg;
  }

  $('quizGoBtn').addEventListener('click', startQuiz);
  $('quizAgainBtn').addEventListener('click', startQuiz);

  /* ── 시작 ── */
  load();
  renderStars();
  checkAttendance();
  startStudy();
  renderMon();
  weeklyCheck();
  // 앱을 켜 둔 채로 날짜가 바뀌어도 다시 열면 출석·새 단어 처리
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && state.att.last !== dayKey()) {
      checkAttendance();
      document.querySelector('nav button[data-tab="study"]').click();
    }
  });
})();
</script>
<script src="/my-dashboard/backup.js" defer></script>
</body>
</html>
